<style>

  .bio-page{

  .bio-wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:22px}
  .bio-photo{width:104px;height:104px;border:2px solid var(--nx-paper);box-shadow:var(--nx-drop-md);border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
  .bio-photo span{font:900 40px/1 var(--nx-font-display);color:var(--nx-paper);letter-spacing:-.02em}
  .bio-name{font:900 24px/1 var(--nx-font-display);letter-spacing:-.02em;color:var(--nx-paper);display:block;text-align:center}
  .bio-tagline{font:400 15px/1.4 var(--nx-font-text);color:rgba(255,255,255,.85);max-width:320px;display:block;text-align:center;margin-top:6px}
  .bio-links{display:flex;flex-direction:column;gap:14px;width:100%}
  .link-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;padding:16px 20px;border:1.5px solid var(--nx-ink);border-radius:14px;box-shadow:var(--nx-drop-sm);font:700 16px/1 var(--nx-font-text);transition:transform .15s ease,box-shadow .15s ease}

  .social-row{display:flex;gap:12px;margin-top:6px}
  .social-row a{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1.5px solid var(--nx-ink);border-radius:50%;background:var(--nx-paper)}
