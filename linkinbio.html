<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muvap · Links</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #0574FD;
      --pink:   #FB4AAD;
      --cyan:   #12EFFB;
      --yellow: #FCDF07;
      --green:  #00CC7A;
      --black:  #000000;
      --white:  #FFFFFF;
    }

    html, body {
      min-height: 100%;
      background: var(--blue);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 60px;
    }

    /* ── Profile ── */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .profile-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,.35));
    }

    .profile-name {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: var(--black);
      -webkit-text-stroke: .065em var(--white);
      paint-order: stroke fill;
      letter-spacing: -.01em;
    }

    .profile-bio {
      font: 400 14px/1.5 'Inter', sans-serif;
      color: rgba(255,255,255,.9);
      text-align: center;
      max-width: 280px;
    }

    /* ── Links ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid var(--black);
      border-radius: 16px;
      box-shadow: 4px 4px 0 var(--black);
      padding: 18px 20px;
      text-decoration: none;
      transition: transform .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    .link-card:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--black);
    }

    .link-card.is-disabled {
      opacity: .55;
      pointer-events: none;
    }

    .link-label {
      font: 700 16px/1 'Inter', sans-serif;
    }

    .soon-badge {
      position: absolute;
      top: -10px;
      right: 14px;
      background: var(--yellow);
      border: 2px solid var(--black);
      border-radius: 999px;
      font: 700 10px/1 'Inter', sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--black);
      padding: 4px 10px;
    }

    /* ── Social footer ── */
    .social-footer {
      margin-top: 28px;
      display: flex;
      gap: 12px;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.15);
      border: 1.5px solid rgba(255,255,255,.3);
      border-radius: 999px;
      padding: 9px 16px;
      text-decoration: none;
      color: var(--white);
      font: 600 13px/1 'Inter', sans-serif;
      transition: background .15s;
      -webkit-tap-highlight-color: transparent;
    }

    .social-link:active {
      background: rgba(255,255,255,.25);
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Profile -->
    <div class="profile">
      <img src="images/muvap-logo.webp" alt="Muvap" class="profile-logo">
      <span class="profile-name">Muvap</span>
      <p class="profile-bio">Construyo sistemas GTM que generan revenue sin que tu equipo dependa de procesos manuales.</p>
    </div>

    <!-- Links -->
    <div class="links">

      <!-- 1. Diagnóstico gratuito (placeholder) -->
      <a href="#" class="link-card is-disabled" style="background:var(--pink)">
        <span class="soon-badge">Próximamente</span>
        <span class="link-label" style="color:#fff">Diagnóstico gratuito</span>
      </a>

      <!-- 2. WhatsApp -->
      <a href="https://wa.me/51981785475?text=Hola%20vengo%20de%20instagram%2C%20estoy%20interesado%20en%20IA%20y%20automatizaci%C3%B3n%20para%20negocios" target="_blank" rel="noopener" class="link-card" style="background:#25D366">
        <span class="link-label" style="color:#fff">Chatear por WhatsApp</span>
      </a>

      <!-- 3. Servicios -->
      <a href="gtm-architecture-evolution.html" class="link-card" style="background:var(--cyan)">
        <span class="link-label" style="color:#000">Ver servicios</span>
      </a>

      <!-- 4. Descargas -->
      <a href="downloads.html" class="link-card" style="background:var(--yellow)">
        <span class="link-label" style="color:#000">Descargas gratuitas</span>
      </a>

      <!-- 5. Blog -->
      <a href="resources.html" class="link-card" style="background:var(--white)">
        <span class="link-label" style="color:#000">Blog de recursos</span>
      </a>

    </div>

    <!-- Social footer -->
    <div class="social-footer">
      <a href="https://www.linkedin.com/in/david-berrocal-vic/" target="_blank" rel="noopener" class="social-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
        LinkedIn
      </a>
    </div>

  </div>
</body>
</html>
