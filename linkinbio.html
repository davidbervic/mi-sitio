<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muvap · Links</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #0574FD;
      --pink:   #FB4AAD;
      --cyan:   #12EFFB;
      --yellow: #FCDF07;
      --green:  #00CC7A;
      --black:  #000000;
      --white:  #FFFFFF;
    }

    html, body {
      min-height: 100%;
      background: var(--blue);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 52px 20px 64px;
    }

    /* ── Profile ── */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
    }

    .profile-logo {
      width: 148px;
      height: 148px;
      object-fit: contain;
    }

    .profile-bio {
      font: 400 14px/1.55 'Inter', sans-serif;
      color: rgba(255,255,255,.88);
      text-align: center;
      max-width: 272px;
    }

    /* ── Buttons ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 2.5px solid var(--black);
      border-radius: 16px;
      box-shadow: 4px 4px 0 var(--black);
      padding: 17px 20px;
      text-decoration: none;
      transition: transform .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--black);
    }

    .btn.is-disabled {
      opacity: .55;
      pointer-events: none;
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 2px solid rgba(0,0,0,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(0,0,0,.12);
    }

    .btn-icon.light {
      border-color: rgba(255,255,255,.3);
      background: rgba(255,255,255,.2);
    }

    .btn-label {
      font: 700 16px/1 'Inter', sans-serif;
      flex: 1;
    }

    .btn-arrow {
      flex-shrink: 0;
      opacity: .5;
    }

    .soon-badge {
      position: absolute;
      top: -10px;
      right: 14px;
      background: var(--yellow);
      border: 2px solid var(--black);
      border-radius: 999px;
      font: 700 10px/1 'Inter', sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--black);
      padding: 4px 10px;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="profile">
      <img src="images/muvap-logo.webp" alt="Muvap" class="profile-logo">
      <p class="profile-bio">Construyo sistemas GTM que generan revenue sin que tu equipo dependa de procesos manuales.</p>
    </div>

    <div class="links">

          </svg>

          </svg>

        <span class="btn-label" style="color:#fff">Chatear por WhatsApp</span>

      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/david-berrocal-vic/" target="_blank" rel="noopener" class="btn" style="background:#0A66C2">

            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>

          <path d="M9 18l6-6-6-6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

      <!-- Servicios -->
      <a href="gtm-architecture-evolution.html" class="btn" style="background:var(--cyan)">

        <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">

        </svg>

      <!-- Descargas -->
      <a href="downloads.html" class="btn" style="background:var(--yellow)">
        <div class="btn-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="btn-label" style="color:#000">Descargas gratuitas</span>
        <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 18l6-6-6-6" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Blog -->
      <a href="resources.html" class="btn" style="background:var(--white)">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 6h16M4 10h16M4 14h10" stroke="#000" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="btn-label" style="color:#000">Blog de recursos</span>
        <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 18l6-6-6-6" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

    </div>
  </div>
</body>
</html>
